<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3DFoodMenu - Administración</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 24px;
    }

    header span {
      color: #aaa;
      font-size: 14px;
    }

    .contenedor {
      display: flex;
      min-height: calc(100vh - 68px);
    }

    aside {
      width: 230px;
      background: white;
      border-right: 1px solid #ddd;
      padding: 25px 15px;
    }

    aside a {
      display: block;
      padding: 14px 15px;
      margin-bottom: 8px;
      color: #333;
      text-decoration: none;
      border-radius: 8px;
    }

    aside a:hover,
    aside a.activo {
      background: #111;
      color: white;
    }

    main {
      flex: 1;
      padding: 35px;
    }

    .titulo {
      margin-bottom: 30px;
    }

    .titulo h2 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .titulo p {
      color: #777;
    }

    .restaurantes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .tarjeta {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .tarjeta h3 {
      margin-bottom: 10px;
      font-size: 20px;
    }

    .tarjeta p {
      color: #777;
      margin-bottom: 18px;
    }

    .estado {
      color: #16803c;
      font-size: 14px;
      margin-bottom: 20px;
    }

    button {
      border: 0;
      background: #111;
      color: white;
      padding: 11px 18px;
      border-radius: 7px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    .nuevo {
      border: 2px dashed #ccc;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 190px;
      cursor: pointer;
    }

    .nuevo:hover {
      border-color: #111;
    }

    .nuevo h3 {
      text-align: center;
    }

    @media (max-width: 700px) {
      aside {
        width: 70px;
      }

      aside a {
        font-size: 0;
        text-align: center;
      }

      main {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>3DFoodMenu</h1>
    <span>Panel de administración</span>
  </header>

  <div class="contenedor">

    <aside>
      <a href="#" class="activo">🏠 Inicio</a>
      <a href="#">🍽️ Restaurantes</a>
      <a href="#">📋 Cartas</a>
      <a href="#">🧊 Modelos 3D</a>
      <a href="#">⚙️ Configuración</a>
    </aside>

    <main>

      <div class="titulo">
        <h2>Restaurantes</h2>
        <p>Gestiona las cartas 3D de todos tus restaurantes.</p>
      </div>

      <div class="restaurantes">

        <div class="tarjeta">
          <h3>🍽️ La Plaza</h3>
          <p>24 platos</p>
          <div class="estado">● Activo</div>
          <button onclick="location.href='restaurante.html?restaurante=la-plaza'">Gestionar restaurante</button>
        </div>

        <div class="tarjeta">
          <h3>🍽️ El Puerto</h3>
          <p>18 platos</p>
          <div class="estado">● Activo</div>
          <button onclick="location.href='restaurante.html?restaurante=el-puerto'">Gestionar restaurante</button>
        </div>

        <div class="tarjeta nuevo">
          <div>
            <h3>＋ Nuevo restaurante</h3>
          </div>
        </div>

      </div>

    </main>

  </div>

</body>
</html>
