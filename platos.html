<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platos - 3DFoodMenu</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 22px;
}

.contenedor {
  max-width: 1100px;
  margin: auto;
  padding: 30px 20px;
}

.volver {
  display: inline-block;
  margin-bottom: 25px;
  color: #555;
  text-decoration: none;
}

h1 {
  margin-bottom: 5px;
}

.subtitulo {
  color: #666;
  margin-bottom: 30px;
}

.formulario {
  background: white;
  padding: 25px;
  border-radius: 12px;
  margin-bottom: 30px;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

input,
textarea {
  width: 100%;
  padding: 12px;
  margin: 7px 0 15px;
  border: 1px solid #ddd;
  border-radius: 7px;
  font-size: 16px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  background: #111;
  color: white;
  border: 0;
  padding: 12px 20px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 15px;
}

button:hover {
  opacity: .85;
}

.platos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
}

.plato {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.plato img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: #eee;
}

.info {
  padding: 18px;
}

.precio {
  font-size: 20px;
  font-weight: bold;
  margin: 8px 0;
}

.descripcion {
  color: #666;
  line-height: 1.5;
}

.eliminar {
  background: #b00020;
  margin-top: 12px;
}
</style>
</head>

<body>

<header>
  <div class="contenedor">
    <strong>3DFoodMenu</strong>
  </div>
</header>

<div class="contenedor">

  <a class="volver" href="javascript:history.back()">← Volver</a>

  <h1 id="titulo">Platos</h1>
  <p class="subtitulo">
    Gestiona los platos del restaurante.
  </p>

  <div class="formulario">

    <h2>Añadir plato</h2>

    <label>Nombre del plato</label>
    <input id="nombre" type="text" placeholder="Ej. Paella de marisco">

    <label>Precio (€)</label>
    <input id="precio" type="number" step="0.01" placeholder="Ej. 18.50">

    <label>Descripción</label>
    <textarea id="descripcion" placeholder="Descripción del plato"></textarea>

    <label>Imagen del plato</label>
    <input id="imagen" type="text" placeholder="URL de la imagen">

    <label>Modelo 3D</label>
    <input id="modelo" type="text" placeholder="URL del modelo .glb">

    <button onclick="agregarPlato()">+ Añadir plato</button>

  </div>

  <h2>Platos del restaurante</h2>

  <div id="listaPlatos" class="platos"></div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://afqaulrezbktcyermaui.supabase.co";
const SUPABASE_KEY = "sb_publishable_PFwnoSTu7-w9ijYx1ccLKg_35-OIHcG";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const parametros = new URLSearchParams(window.location.search);
const restauranteSlug = parametros.get("restaurante") || "la-plaza";

const nombreRestaurante = restauranteSlug
  .replace(/-/g, " ")
  .replace(/\b\w/g, letra => letra.toUpperCase());

document.getElementById("titulo").textContent =
  "Platos - " + nombreRestaurante;


async function cargarPlatos() {

  const lista = document.getElementById("listaPlatos");

  lista.innerHTML = "<p style='color:#777;'>Cargando platos...</p>";

  const { data: restaurante, error: errorRestaurante } =
    await supabase
      .from("restaurantes")
      .select("id, nombre")
      .eq("nombre", nombreRestaurante)
      .single();

  if (errorRestaurante || !restaurante) {
    lista.innerHTML =
      "<p style='color:#b00020;'>No se ha encontrado el restaurante.</p>";

    console.error("Error restaurante:", errorRestaurante);
    return;
  }

  const { data: platos, error: errorPlatos } =
    await supabase
      .from("platos")
      .select("*")
      .eq("restaurante_id", restaurante.id);

  if (errorPlatos) {
    lista.innerHTML =
      "<p style='color:#b00020;'>Error al cargar los platos.</p>";

    console.error("Error platos:", errorPlatos);
    return;
  }

  if (!platos || platos.length === 0) {
    lista.innerHTML = `
      <p style="color:#777;">
        Todavía no hay platos. Añade el primero arriba.
      </p>
    `;
    return;
  }

  lista.innerHTML = "";

  platos.forEach(plato => {

    const tarjeta = document.createElement("div");
    tarjeta.className = "plato";

    tarjeta.innerHTML = `
      ${
        plato.url_de_la_imagen
          ? `<img
              src="${plato.url_de_la_imagen}"
              alt="${plato.nombre}"
              style="width:100%;height:180px;object-fit:cover;">
            `
          : `
            <div style="
              height:180px;
              background:#eee;
              display:flex;
              align-items:center;
              justify-content:center;">
              Sin imagen
            </div>
          `
      }

      <div class="info">
        <h3>${plato.nombre}</h3>

        <p class="precio">
          ${plato.precio ?? 0} €
        </p>

        <p>
          ${plato.descripcion || ""}
        </p>

        <button
          class="eliminar"
          onclick="eliminarPlato('${plato.id}')">
          Eliminar
        </button>
      </div>
    `;

    lista.appendChild(tarjeta);
  });
}


async function agregarPlato() {

  const nombre = document.getElementById("nombre").value.trim();
  const precio = document.getElementById("precio").value;
  const descripcion = document.getElementById("descripcion").value.trim();
  const imagen = document.getElementById("imagen").value.trim();
  const modelo = document.getElementById("modelo").value.trim();

  if (!nombre || !precio) {
    alert("Introduce al menos el nombre y el precio.");
    return;
  }

  const boton = document.querySelector("button[onclick='agregarPlato()']");
  boton.disabled = true;
  boton.textContent = "Guardando...";

  try {

    const { data: restaurante, error: errorRestaurante } =
      await supabase
        .from("restaurantes")
        .select("id, nombre")
        .eq("nombre", nombreRestaurante)
        .single();

    if (errorRestaurante || !restaurante) {
      console.error(errorRestaurante);
      alert("No se ha encontrado el restaurante.");
      return;
    }

    const { data, error } =
      await supabase
        .from("platos")
        .insert({
          restaurante_id: restaurante.id,
          nombre: nombre,
          precio: Number(precio),
          descripcion: descripcion,
          url_de_la_imagen: imagen || null,
          url_del_modelo_3d: modelo || null
        })
        .select()
        .single();

    if (error) {
      console.error("Error Supabase:", error);
      alert("Error al guardar el plato: " + error.message);
      return;
    }

    alert("Plato añadido correctamente.");

    document.getElementById("nombre").value = "";
    document.getElementById("precio").value = "";
    document.getElementById("descripcion").value = "";
    document.getElementById("imagen").value = "";
    document.getElementById("modelo").value = "";

    await cargarPlatos();

  } catch (error) {

    console.error(error);
    alert("Ha ocurrido un error al guardar el plato.");

  } finally {

    boton.disabled = false;
    boton.textContent = "+ Añadir plato";
  }
}


async function eliminarPlato(id) {

  if (!confirm("¿Quieres eliminar este plato?")) {
    return;
  }

  const { error } =
    await supabase
      .from("platos")
      .delete()
      .eq("id", id);

  if (error) {
    console.error(error);
    alert("No se ha podido eliminar el plato.");
    return;
  }

  await cargarPlatos();
}


cargarPlatos();

</script>

</body>
</html>
