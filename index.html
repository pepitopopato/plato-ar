<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba AR — Mi plato</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:24px;text-align:center;background:#f7f7f7}
h1{font-size:24px}
model-viewer{width:100%;height:65vh;background:white;border-radius:18px}
button{margin-top:16px;padding:14px 22px;border:0;border-radius:12px;font-size:17px;cursor:pointer}
p{color:#555}
</style>
</head>
<body>
<h1>Mi plato en 3D</h1>
<p>Gira el plato con el dedo y pulsa «Ver en mi mesa» para probar la realidad aumentada.</p>
<model-viewer
  src="models/12_8_2026.glb"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  alt="Modelo 3D del plato">
  <button slot="ar-button">📱 Ver en mi mesa</button>
</model-viewer>
</body>
</html>
