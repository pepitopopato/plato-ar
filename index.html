<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>3DFoodMenu - Carta 3D</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #ccc;
      font-size: 14px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 25px 16px 50px;
    }

    .intro {
      text-align: center;
      margin-bottom: 25px;
    }

    .intro h2 {
      margin-bottom: 8px;
    }

    .intro p {
      color: #666;
    }

    .platos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .plato {
      background: white;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .plato h3 {
      margin: 12px 0 5px;
      font-size: 20px;
    }

    .plato p {
      color: #666;
      font-size: 14px;
    }

    .precio {
      font-weight: bold;
      font-size: 18px;
      margin: 12px 0;
    }

    model-viewer {
      width: 100%;
      height: 280px;
      background: #f1f1ef;
      border-radius: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    footer {
      text-align: center;
      color: #888;
      font-size: 13px;
      padding: 25px;
    }
  </style>
</head>

<body>

  <header>
    <h1>3DFoodMenu</h1>
    <p>Descubre los platos antes de pedir</p>
  </header>

  <main>

    <section class="intro">
      <h2>🍽️ Nuestra carta</h2>
      <p>Explora nuestros platos en 3D y visualízalos en tu mesa.</p>
    </section>

    <section class="platos">

      <article class="plato">

        <model-viewer
          src="modelos/12_8_2026.glb"
          camera-controls
          auto-rotate
          ar
          shadow-intensity="1"
          alt="Plato en 3D">

          <button slot="ar-button">
            📱 Ver en mi mesa
          </button>

        </model-viewer>

        <h3>Plato de ejemplo</h3>

        <p>
          Descubre este plato en 3D y comprueba cómo se vería en tu mesa.
        </p>

        <div class="precio">12,90 €</div>

      </article>

    </section>

  </main>

  <footer>
    © 2026 3DFoodMenu
  </footer>

</body>
</html>
